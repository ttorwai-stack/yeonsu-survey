<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 결과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --plane: #f4f4f2;
    --surface: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --line: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-ink: #1c5cab;
    --accent-soft: #e8f1fc;
    --s1: #2a78d6;
    --s2: #eb6834;
    --l1: #c43c3c; --l2: #ee9a99; --l3: #d4d3cd; --l4: #86b6ef; --l5: #256abf;
    --danger: #d03b3b;
    --ok: #006300;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--plane); color: var(--ink); }
  body { font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .top-in { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 700; margin-right: auto; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
  .tab.on { background: var(--accent-soft); color: var(--accent-ink); }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 14px; }
  .toolbar .grow { margin-right: auto; }
  .toolbar h2 { margin: 0; font-size: 22px; }
  .toolbar .sub { color: var(--ink-2); font-size: 13.5px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { font-size: 13px; color: var(--ink-2); }
  .kpi .v { font-size: 30px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .kpi .v small { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
  .kpi .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; break-inside: avoid; }
  .card-h { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .card-h h3 { margin: 0; font-size: 16px; }
  .card-h .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .card-h .act { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .chart-box { position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sec { font-size: 18px; font-weight: 700; margin: 26px 0 10px; }
  .minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .minis .card { margin: 0; padding: 14px; }
  .minis h4 { margin: 0 0 2px; font-size: 13.5px; }
  .minis .m { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: middle; }
  th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; background: #fafaf8; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl-wrap { overflow-x: auto; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; color: #8a5200; background: #fff1d1; border-radius: 5px; padding: 0 5px; margin-left: 4px; }
  .cellbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
  .cellbar.b { background: var(--s2); }
  .muted { color: var(--ink-3); }

  .open-q { margin-bottom: 14px; }
  .open-list { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  .open-list li { padding: 9px 2px; border-bottom: 1px solid var(--grid); white-space: pre-wrap; }
  .open-list li:last-child { border-bottom: 0; }

  /* 설정 */
  .form { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: start; }
  .form label { font-weight: 600; padding-top: 8px; font-size: 13.5px; }
  .form input[type=text], .form textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--axis); border-radius: 8px; background: #fff; }
  .form textarea { min-height: 90px; font-size: 13.5px; line-height: 1.55; }
  .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .tt textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--grid); border-radius: 6px; font: inherit; font-size: 13.5px; resize: vertical; line-height: 1.45; }
  .tt input { width: 100%; padding: 6px 8px; border: 1px solid var(--grid); border-radius: 6px; }
  .tt td { padding: 4px; border: 0; }
  .tt th { background: none; }
  .tt .grp { width: 80px; }
  .tt tr.split td { background: #fff8e6; }
  .x { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; padding: 2px 8px; }
  .x:hover { color: var(--danger); }

  .login { max-width: 360px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .login h2 { margin: 0 0 14px; font-size: 19px; }
  .login input { width: 100%; padding: 11px 12px; border: 1px solid var(--axis); border-radius: 9px; margin-bottom: 10px; }
  .login .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .empty { text-align: center; color: var(--ink-2); padding: 60px 20px; }

  /* 설문 목록 */
  .st { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
  .st.open { color: #0a6b0a; background: #e3f5e3; }
  .st.closed { color: var(--ink-2); background: #ecebe7; }
  .svy-t { font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-size: 14.5px; }
  .svy-t:hover { color: var(--accent-ink); text-decoration: underline; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; }
  .back { border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; padding: 6px 8px 6px 0; }
  .back:hover { color: var(--accent-ink); }
  .top h1 .st { margin-left: 8px; vertical-align: 2px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; display: none; }

  @media (max-width: 820px) {
    .grid2 { grid-template-columns: 1fr; }
    .form { grid-template-columns: 1fr; }
    .form label { padding-top: 0; }
  }
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; font-size: 12px; }
    header.top, .toolbar .btn, .toolbar select, .card-h .act, .no-print { display: none !important; }
    .card, .kpi { border-color: #ddd; }
    .open-list { max-height: none; overflow: visible; }
    th { position: static; }
    .wrap { max-width: none; padding: 0; }
  }
</style>
</head>
<body>
<div id="root"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ───── 서버 호출 ───── */
  // 실행 환경: Apps Script 안(gas) / 내 PC 미리보기(mock) / GitHub Pages 등 외부(http)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyUUAH8jsoHkZlngyhJ6pab1aRJy3X7qi1H0665IOJNG7RxVgA21-v33suYtOqjMyGo3Q/exec';
  var MODE = (window.google && google.script && google.script.run) ? 'gas'
    : /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'mock' : 'http';
  var ready = new Promise(function (resolve) {
    if (MODE !== 'mock') return resolve();
    var s = document.createElement('script');
    s.src = 'dev/mock.js';
    s.onload = function () { window.MockReady.then(resolve); };
    document.head.appendChild(s);
  });
  function pageBase() { return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, ''); }
  // 서버 혼잡(BUSY)이나 구글 쪽 일시 오류는 자동으로 다시 시도한다.
  // 제출(submitResponse)은 저장되지 않은 것이 확실한 경우(BUSY, 서버가 요청을 거절)에만 다시 보낸다.
  function httpCall(name, args, attempt) {
    attempt = attempt || 0;
    var waits = [1500, 3000, 5000, 8000];
    var retry = function (why) {
      if (attempt >= waits.length) throw why;
      return new Promise(function (r) { setTimeout(r, waits[attempt] + Math.random() * 1000); })
        .then(function () { return httpCall(name, args, attempt + 1); });
    };
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: name, args: args }) })
      .then(function (r) {
        return r.text().then(function (t) {
          var j;
          try { j = JSON.parse(t); } catch (e) { return retry(new Error('서버가 바빠요. 잠시 후 다시 눌러 주세요.')); } // 구글이 실행 전에 거절(HTML 오류)
          if (j.ok) return j.data;
          if (/^BUSY/.test(j.error)) return retry(new Error(j.error.replace(/^BUSY:\s*/, '')));
          throw new Error(j.error);
        });
      }, function (netErr) {
        if (name === 'submitResponse') throw new Error('인터넷 연결을 확인해 주세요.'); // 저장됐는지 모르므로 자동 재전송하지 않음
        return retry(netErr);
      });
  }
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return ready.then(function () {
      if (MODE === 'mock') return window.MockAPI[name].apply(null, args);
      if (MODE === 'http') {
        if (name === 'getAppUrl') return pageBase();
        return httpCall(name, args);
      }
      return new Promise(function (res, rej) {
        var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
        r[name].apply(r, args);
      });
    });
  }

  var root = document.getElementById('root');
  var KEY = '', D = null, cohort = null, tab = 'dash', charts = [];
  var SURVEYS = [], CUR = null, APPURL = '';
  var OPEN = '진행 중', CLOSED = '마감';
  var LIK = ['--l1', '--l2', '--l3', '--l4', '--l5'].map(cssVar);
  var SERIES = [cssVar('--s1'), cssVar('--s2'), '#1baf7a', '#eda100'];

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function f2(x) { return isFinite(x) ? x.toFixed(2) : '–'; }
  function pct(x) { return isFinite(x) ? (x * 100).toFixed(1) + '%' : '–'; }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600); }
  function errMsg(e) { return (e && e.message) || String(e); }

  if (window.Chart) {
    Chart.defaults.font.family = '"Pretendard Variable", Pretendard, system-ui, sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#52514e';
    Chart.defaults.borderColor = '#e1e0d9';
    Chart.defaults.plugins.tooltip.backgroundColor = '#0b0b0b';
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.animation.duration = 300;
  }
  // PNG 저장 시 흰 배경
  var whiteBg = { id: 'whiteBg', beforeDraw: function (c) { var x = c.ctx; x.save(); x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.restore(); } };
  // 가로 막대 끝에 값 표시 (이미지로 저장해도 숫자가 보이도록)
  var endLabels = { id: 'endLabels', afterDatasetsDraw: function (c) {
    var x = c.ctx; x.save(); x.font = '600 11px "Pretendard Variable", Pretendard, system-ui, sans-serif'; x.fillStyle = '#52514e'; x.textBaseline = 'middle';
    c.data.datasets.forEach(function (ds, di) {
      c.getDatasetMeta(di).data.forEach(function (bar, i) { var v = ds.data[i]; if (v != null) x.fillText(Number(v).toFixed(2), bar.x + 5, bar.y); });
    });
    x.restore();
  } };

  /* ───── 로그인 ───── */
  function showLogin(msg) {
    root.innerHTML = '<form class="login" id="lf"><h2>설문 관리 · 관리자</h2><input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password" autofocus>' +
      '<div class="err">' + esc(msg || '') + '</div><button class="btn primary" style="width:100%;padding:11px">들어가기</button></form>';
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault();
      var k = document.getElementById('pw').value;
      api('verifyKey', k).then(function (ok) { if (!ok) return showLogin('비밀번호가 맞지 않아요.'); KEY = k; ss('svy-admin', k); loadList(); }).catch(function (er) { showLogin(errMsg(er)); });
    };
  }

  /* ───── 설문 목록 ───── */
  function surveyUrl(id) { return APPURL + '?s=' + encodeURIComponent(id); }

  function loadList() {
    charts.forEach(function (c) { c.destroy(); }); charts = [];
    CUR = null; D = null;
    root.innerHTML = '<div class="empty">설문 목록을 불러오는 중…</div>';
    Promise.all([api('listSurveys', KEY), APPURL ? APPURL : api('getAppUrl').catch(function () { return ''; })]).then(function (r) {
      SURVEYS = r[0]; APPURL = r[1] || APPURL;
      renderList();
    }).catch(function (e) { KEY = ''; ss('svy-admin', ''); showLogin(errMsg(e)); });
  }

  function statusBadge(st) { return '<span class="st ' + (st === OPEN ? 'open' : 'closed') + '">' + esc(st) + '</span>'; }

  function renderList() {
    var nOpen = SURVEYS.filter(function (s) { return s.status === OPEN; }).length;
    var h = '<header class="top"><div class="wrap top-in"><h1>설문 관리</h1></div></header><div class="wrap">' +
      '<div class="toolbar"><div class="grow"><h2>설문 ' + SURVEYS.length + '개</h2><div class="sub">진행 중 ' + nOpen + '개 · 설문마다 결과 시트가 드라이브 「연수 설문」 폴더에 따로 만들어져요</div></div>' +
      '<button class="btn" id="refresh">새로고침</button><button class="btn primary" id="new">새 설문 만들기</button></div>';
    if (!SURVEYS.length) {
      h += '<div class="card empty">아직 만든 설문이 없어요.<br>[새 설문 만들기]를 누르거나, 다음 기수부터는 이전 설문을 [복사]해서 쓰면 돼요.</div>';
    } else {
      h += '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>설문</th><th>상태</th><th class="num">응답</th><th>만든 날짜</th><th>마지막 응답</th><th>작업</th></tr></thead><tbody>' +
        SURVEYS.map(function (s) {
          return '<tr><td><button class="svy-t" data-act="dash" data-id="' + esc(s.id) + '">' + esc(s.title) + '</button><div class="muted" style="font-size:12.5px">' + esc([s.course, s.cohort].filter(Boolean).join(' · ')) + '</div></td>' +
            '<td>' + statusBadge(s.status) + '</td><td class="num">' + s.count + '</td><td class="muted">' + esc(s.created) + '</td><td class="muted">' + esc(s.last || '–') + '</td>' +
            '<td><div class="acts">' +
            '<button class="btn sm" data-act="dash" data-id="' + esc(s.id) + '">결과</button>' +
            '<button class="btn sm" data-act="cfg" data-id="' + esc(s.id) + '">설정</button>' +
            '<button class="btn sm" data-act="link" data-id="' + esc(s.id) + '">링크 복사</button>' +
            '<button class="btn sm" data-act="copy" data-id="' + esc(s.id) + '" title="이 설문 설정을 그대로 복사해 새 설문을 만들어요">복사해서 새로</button>' +
            '<button class="btn sm" data-act="toggle" data-id="' + esc(s.id) + '">' + (s.status === OPEN ? '마감하기' : '다시 열기') + '</button>' +
            (s.sheetUrl && s.sheetUrl !== 'about:blank' ? '<a class="btn sm" href="' + esc(s.sheetUrl) + '" target="_blank" rel="noopener">시트</a>' : '') +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    root.innerHTML = h + '</div>';
    document.getElementById('refresh').onclick = loadList;
    document.getElementById('new').onclick = function () { newSurvey(null, this); };
    root.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.id, act = b.dataset.act;
        if (act === 'dash' || act === 'cfg') openSurvey(id, act);
        else if (act === 'link') copyLink(id);
        else if (act === 'copy') newSurvey(id, b);
        else if (act === 'toggle') toggleStatus(id, b);
      };
    });
  }

  function newSurvey(srcId, btn) {
    btn.disabled = true; btn.textContent = '만드는 중…';
    api('createSurvey', KEY, srcId).then(function (r) {
      toast(srcId ? '복사했어요. 제목·기수·시간표를 고쳐 주세요.' : '새 설문을 만들었어요. 내용을 채워 주세요.');
      openSurvey(r.id, 'cfg');
    }).catch(function (e) { btn.disabled = false; toast(errMsg(e)); renderList(); });
  }

  function toggleStatus(id, btn) {
    var s = SURVEYS.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    var to = s.status === OPEN ? CLOSED : OPEN;
    if (to === CLOSED && !confirm('「' + s.title + '」을(를) 마감할까요?\n마감하면 응답 링크로 더 이상 응답할 수 없어요. (다시 열 수 있어요)')) return;
    btn.disabled = true;
    api('setSurveyStatus', KEY, id, to).then(function () {
      s.status = to; if (D && CUR === id) D.meta.status = to;
      toast(to === CLOSED ? '마감했어요.' : '다시 열었어요.');
      if (CUR === id) render(); else renderList();
    }).catch(function (e) { btn.disabled = false; toast(errMsg(e)); });
  }

  function openSurvey(id, which) {
    charts.forEach(function (c) { c.destroy(); }); charts = [];
    CUR = id; tab = which || 'dash'; cohort = null;
    root.innerHTML = '<div class="empty">불러오는 중…</div>';
    api('getResults', KEY, id).then(function (d) {
      D = d;
      var cs = cohorts();
      cohort = cs.indexOf(D.config.cohort) >= 0 ? D.config.cohort : cs[cs.length - 1] || D.config.cohort;
      render();
    }).catch(function (e) { toast(errMsg(e)); loadList(); });
  }

  /* ───── 데이터 가공 ───── */
  function objs(t) { return t.rows.map(function (r) { var o = {}; t.headers.forEach(function (h, i) { o[h] = r[i]; }); return o; }); }
  function cohorts() { var s = []; objs(D.resp).forEach(function (o) { if (o['기수'] && s.indexOf(o['기수']) < 0) s.push(o['기수']); }); return s; }

  function summarize(cnt) {
    var n = 0, sum = 0; cnt.forEach(function (c, i) { n += c; sum += c * (i + 1); });
    return { counts: cnt, n: n, mean: n ? sum / n : NaN, top2: n ? (cnt[3] + cnt[4]) / n : NaN };
  }

  function compute(ch) {
    var resp = objs(D.resp).filter(function (o) { return o['기수'] === ch; });
    var sc = objs(D.scores).filter(function (o) { return o['기수'] === ch; });
    var S = { n: resp.length, overall: [], itemKeys: [], courses: [], demo: [], open: [], lblOverall: [], lblSession: [] };

    var ov = {}, ovOrder = [], crs = {}, pos = {}, seenPerResp = {};
    sc.forEach(function (o) {
      var v = parseInt(o['점수'], 10); if (!(v >= 1 && v <= 5)) return;
      if (o['영역'] === '과정만족도') {
        if (!ov[o['문항']]) { ov[o['문항']] = [0, 0, 0, 0, 0]; ovOrder.push(o['문항']); }
        ov[o['문항']][v - 1]++;
        S.lblOverall[v - 1] = o['응답'];
      } else if (o['영역'] === '과목평가') {
        var key = [o['일자'], o['시간'], o['과목'], o['강사']].join('|');
        if (S.itemKeys.indexOf(o['문항']) < 0) S.itemKeys.push(o['문항']);
        var k = seenPerResp[o['응답ID']] = (seenPerResp[o['응답ID']] || 0) + 1;
        if (!crs[key]) { crs[key] = { date: o['일자'], time: o['시간'], title: o['과목'], inst: o['강사'], split: o['분반수업'] === 'Y', by: {}, pos: 1e9 }; }
        crs[key].pos = Math.min(crs[key].pos, Math.floor((k - 1) / Math.max(1, S.itemKeys.length)));
        var b = crs[key].by[o['문항']] = crs[key].by[o['문항']] || [0, 0, 0, 0, 0];
        b[v - 1]++;
        S.lblSession[v - 1] = o['응답'];
      }
    });
    S.overall = ovOrder.map(function (q) { var s = summarize(ov[q]); s.item = q; return s; });
    S.courses = Object.keys(crs).map(function (k) {
      var c = crs[k]; var by = {};
      S.itemKeys.forEach(function (ik) { by[ik] = summarize(c.by[ik] || [0, 0, 0, 0, 0]); });
      c.by = by; c.n = by[S.itemKeys[0]] ? by[S.itemKeys[0]].n : 0; return c;
    });
    // 현재 설정의 시간표에 있는 과목은 그 순서대로, 아니면 응답 순서대로
    var cfgOrder = {}, oi = 0;
    (D.config.slots || []).forEach(function (s) { s.options.forEach(function (o) { cfgOrder[s.date + '|' + s.time + '|' + o.title + '|' + o.instructor] = oi++; }); });
    S.courses.forEach(function (c) { var k = [c.date, c.time, c.title, c.inst].join('|'); c.ord = k in cfgOrder ? cfgOrder[k] : 1000 + c.pos; });
    S.courses.sort(function (a, b) { return a.ord - b.ord || a.pos - b.pos || (a.title > b.title ? 1 : -1); });
    S.courses.forEach(function (c, i) { c.pos = i; });

    // 기본정보: 기수 다음 열부터 첫 "[과정]" 열 전까지
    // 응답자 정보 열 = 설정의 기본 정보 문항 (없으면 예전 방식: 기수 다음 ~ 첫 [과정] 열 전)
    var H = D.resp.headers, demoCols = (D.config.demographics || []).map(function (d) { return d.label; }).filter(function (l) { return H.indexOf(l) >= 0; });
    if (!demoCols.length && (D.config.demographics || []).length) { var i0 = H.indexOf('기수') + 1, i1 = H.findIndex(function (h) { return h.indexOf('[과정]') === 0; }); demoCols = H.slice(i0, i1 < 0 ? i0 : i1); }
    demoCols.filter(function (h) { return !/\(기타 입력\)$/.test(h); }).forEach(function (h) {
      var m = {}; resp.forEach(function (o) { var v = o[h]; if (v) m[v] = (m[v] || 0) + 1; });
      var entries = Object.keys(m).map(function (k) { return [k, m[k]]; });
      if (entries.length) S.demo.push({ label: h, entries: entries });
    });
    // 설정의 선택지 순서대로 정렬
    S.demo.forEach(function (d) {
      var def = (D.config.demographics || []).filter(function (x) { return x.label === d.label; })[0];
      var order = def ? def.options : [];
      d.entries.sort(function (a, b) {
        var ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || b[1] - a[1];
      });
    });

    var junk = /^(없음|없습니다|없어요|무|x|-|\.|해당없음|해당 없음|특별히 없음|딱히 없음)\.?$/i;
    (D.config.open || []).forEach(function (q) {
      if (H.indexOf(q.short) < 0) return;
      var all = resp.map(function (o) { return { id: o['응답ID'], text: String(o[q.short] || '').trim() }; }).filter(function (a) { return a.text; });
      S.open.push({ q: q.short, text: q.text, answers: all.filter(function (a) { return !junk.test(a.text); }), skipped: all.filter(function (a) { return junk.test(a.text); }).length });
    });
    S.resp = resp; S.scores = sc;
    return S;
  }

  /* ───── 화면 ───── */
  function render() {
    charts.forEach(function (c) { c.destroy(); }); charts = [];
    var cs = cohorts();
    var m = D.meta;
    root.innerHTML = '<header class="top"><div class="wrap top-in"><button class="back" id="back">← 설문 목록</button><h1>' + esc(D.config.title) + statusBadge(m.status) + '</h1>' +
      '<nav class="tabs"><button class="tab' + (tab === 'dash' ? ' on' : '') + '" data-tab="dash">결과</button><button class="tab' + (tab === 'cfg' ? ' on' : '') + '" data-tab="cfg">설문 설정</button></nav>' +
      '<button class="btn" id="copy-link">응답 링크 복사</button><button class="btn" id="toggle">' + (m.status === OPEN ? '마감하기' : '다시 열기') + '</button>' +
      (m.sheetUrl && m.sheetUrl !== 'about:blank' ? '<a class="btn" href="' + esc(m.sheetUrl) + '" target="_blank" rel="noopener">시트 열기</a>' : '') +
      '</div></header><div class="wrap" id="body"></div>';
    root.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; render(); }; });
    document.getElementById('back').onclick = loadList;
    document.getElementById('copy-link').onclick = function () { copyLink(CUR); };
    document.getElementById('toggle').onclick = function () {
      if (!SURVEYS.some(function (x) { return x.id === CUR; })) SURVEYS.push(m);
      toggleStatus(CUR, this);
    };
    if (tab === 'cfg') return renderConfig();
    var body = document.getElementById('body');
    if (!cs.length) { body.innerHTML = '<div class="empty">아직 응답이 없어요. 위의 [응답 링크 복사]로 링크를 연수생에게 보내 주세요.</div>'; return; }
    renderDash(body, cs);
  }

  function copyLink(id) {
    var url = surveyUrl(id);
    Promise.resolve().then(function () { return navigator.clipboard.writeText(url); })
      .then(function () { toast('응답 링크를 복사했어요.'); })
      .catch(function () { prompt('아래 링크를 복사하세요', url); });
  }

  function chartCard(id, title, desc, h, extra) {
    return '<div class="card"><div class="card-h"><div><h3>' + esc(title) + '</h3>' + (desc ? '<div class="d">' + esc(desc) + '</div>' : '') + '</div>' +
      '<div class="act"><button class="btn sm" data-png="' + id + '" data-name="' + esc(title) + '">이미지 저장</button></div></div>' + (extra || '') +
      '<div class="chart-box" style="height:' + h + 'px"><canvas id="' + id + '" role="img" aria-label="' + esc(title) + '"></canvas></div></div>';
  }
  function legendHTML(items) { return '<div class="legend">' + items.map(function (it) { return '<span><i style="background:' + it[1] + '"></i>' + esc(it[0]) + '</span>'; }).join('') + '</div>'; }

  function renderDash(body, cs) {
    var S = compute(cohort);
    var first = S.overall[0], allOv = summarize([0, 1, 2, 3, 4].map(function (i) { return S.overall.reduce(function (a, o) { return a + o.counts[i]; }, 0); }));
    var itemAgg = S.itemKeys.map(function (k) { return { k: k, s: summarize([0, 1, 2, 3, 4].map(function (i) { return S.courses.reduce(function (a, c) { return a + c.by[k].counts[i]; }, 0); })) }; });

    var h = '<div class="toolbar"><div class="grow"><h2>' + esc(cohort) + ' 결과</h2><div class="sub">응답 ' + S.n + '명 · 점수는 5점 만점 평균, 만족 비율은 4~5점 응답 비율</div></div>' +
      (cs.length > 1 ? '<select id="cohort" aria-label="기수 선택">' + cs.map(function (c) { return '<option' + (c === cohort ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' : '') +
      '<button class="btn" id="reload">새로고침</button><button class="btn" id="print">인쇄 / PDF</button><button class="btn primary" id="xlsx">엑셀 다운로드</button></div>';

    h += '<div class="kpis">' +
      kpi('응답자', S.n, '명', '') +
      (first ? kpi('전반 만족도', f2(first.mean), '/ 5', '만족 비율 ' + pct(first.top2)) : '') +
      (S.overall.length ? kpi(txt(D.config, 'overallTitle') + ' 평균', f2(allOv.mean), '/ 5', S.overall.length + '개 지표 · 만족 비율 ' + pct(allOv.top2)) : '') +
      itemAgg.map(function (a) { return kpi('과목 ' + a.k + ' 평균', f2(a.s.mean), '/ 5', S.courses.length + '개 과목 · 만족 비율 ' + pct(a.s.top2)); }).join('') + '</div>';

    // 설정에서 뺀 단계(문항 0개)는 결과 화면에서도 숨긴다
    if (S.overall.length) {
    h += '<div class="sec">' + esc(txt(D.config, 'overallTitle')) + '</div>';
    h += chartCard('c-ov', txt(D.config, 'overallTitle') + ' 지표별 응답 분포', '막대 길이 = 응답 비율, 괄호 = 평균 점수', 46 + S.overall.length * 40,
      legendHTML(LIK.map(function (c, i) { return [(i + 1) + '점 ' + (S.lblOverall[i] || ''), c]; })));
    h += '<div class="minis">' + S.overall.map(function (o, i) {
      return '<div class="card"><div class="card-h"><div><h4>' + esc(o.item) + '</h4><div class="m">평균 ' + f2(o.mean) + ' · 만족 ' + pct(o.top2) + ' · ' + o.n + '명</div></div>' +
        '<div class="act"><button class="btn sm" data-png="c-m' + i + '" data-name="' + esc(o.item) + '">저장</button></div></div><div class="chart-box" style="height:150px"><canvas id="c-m' + i + '" role="img" aria-label="' + esc(o.item) + ' 응답 분포"></canvas></div></div>';
    }).join('') + '</div>';
    }

    if (S.courses.length) {
    h += '<div class="sec">' + esc(txt(D.config, 'slotsTitle')) + '</div>';
    h += chartCard('c-cr', '과목별 평균 점수', '1~5점 척도 · 분반 과목은 해당 분반 수강자만 응답', 60 + S.courses.length * 42,
      legendHTML(S.itemKeys.map(function (k, i) { return [k, SERIES[i]]; })));
    h += '<div class="card"><div class="card-h"><div><h3>과목별 상세</h3><div class="d">시간표 순서 · 열 제목을 누르면 정렬</div></div></div><div class="tbl-wrap"><table id="crs-tbl"><thead><tr>' +
      '<th data-sort="pos">일자</th><th>시간</th><th data-sort="title">과목</th><th>강사</th><th class="num" data-sort="n">응답</th>' +
      S.itemKeys.map(function (k, i) { return '<th class="num" data-sort="m' + i + '">' + esc(k) + ' 평균</th><th class="num" data-sort="t' + i + '">' + esc(k) + ' 만족</th>'; }).join('') +
      '</tr></thead><tbody></tbody></table></div></div>';
    }

    if (S.demo.length) h += '<div class="sec">응답자 구성</div><div class="minis">' + S.demo.map(function (d, i) {
      return '<div class="card"><div class="card-h"><div><h4>' + esc(d.label) + '</h4></div><div class="act"><button class="btn sm" data-png="c-d' + i + '" data-name="' + esc(d.label) + '">저장</button></div></div>' +
        '<div class="chart-box" style="height:' + (30 + d.entries.length * 30) + 'px"><canvas id="c-d' + i + '" role="img" aria-label="' + esc(d.label) + ' 구성"></canvas></div></div>';
    }).join('') + '</div>';

    if (S.open.length) h += '<div class="sec">' + esc(txt(D.config, 'openTitle')) + '</div><div class="grid2">' + S.open.map(function (q) {
      return '<div class="card open-q"><div class="card-h"><div><h3>' + esc(q.q) + ' <span class="muted" style="font-weight:500">' + q.answers.length + '건</span></h3>' +
        (q.skipped ? '<div class="d">"없음" 등 ' + q.skipped + '건 제외</div>' : '') + '</div></div>' +
        (q.answers.length ? '<ul class="open-list">' + q.answers.map(function (a) { return '<li>' + esc(a.text) + '</li>'; }).join('') + '</ul>' : '<div class="muted">응답 없음</div>') + '</div>';
    }).join('') + '</div>';
    h += '<div style="height:40px"></div>';

    body.innerHTML = h;

    var sel = document.getElementById('cohort'); if (sel) sel.onchange = function () { cohort = sel.value; render(); };
    document.getElementById('reload').onclick = function () { openSurvey(CUR, 'dash'); };
    document.getElementById('print').onclick = function () { window.print(); };
    document.getElementById('xlsx').onclick = function () { exportXlsx(S); };
    body.querySelectorAll('[data-png]').forEach(function (b) { b.onclick = function () { savePng(b.dataset.png, b.dataset.name); }; });

    if (S.overall.length) { drawOverall(S); drawMinis(S); }
    if (S.courses.length) { drawCourses(S); fillCourseTable(S, 'pos', 1); }
    drawDemo(S);
    body.querySelectorAll('#crs-tbl [data-sort]').forEach(function (th) {
      th.style.cursor = 'pointer';
      th.onclick = function () { var k = th.dataset.sort; var dir = fillCourseTable._k === k ? -fillCourseTable._d : (k === 'pos' || k === 'title' ? 1 : -1); fillCourseTable(S, k, dir); };
    });
  }

  function kpi(k, v, unit, s) { return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '<small>' + esc(unit) + '</small></div>' + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>'; }

  function courseLabel(c) { return c.date + ' ' + c.time + ' ' + c.title + ' (' + String(c.inst).split(/\s+/).pop() + ')'; }

  function fillCourseTable(S, key, dir) {
    fillCourseTable._k = key; fillCourseTable._d = dir;
    var rows = S.courses.slice().sort(function (a, b) {
      var va, vb;
      if (key === 'pos') { va = a.pos; vb = b.pos; } else if (key === 'title') { va = a.title; vb = b.title; } else if (key === 'n') { va = a.n; vb = b.n; }
      else { var ik = S.itemKeys[+key.slice(1)], f = key[0] === 'm' ? 'mean' : 'top2'; va = a.by[ik][f]; vb = b.by[ik][f]; }
      return (va > vb ? 1 : va < vb ? -1 : 0) * dir;
    });
    document.querySelector('#crs-tbl tbody').innerHTML = rows.map(function (c) {
      return '<tr><td>' + esc(c.date) + '</td><td>' + esc(c.time) + '</td><td>' + esc(c.title) + (c.split ? '<span class="badge">분반</span>' : '') + '</td><td>' + esc(c.inst) + '</td><td class="num">' + c.n + '</td>' +
        S.itemKeys.map(function (k, i) {
          var s = c.by[k];
          return '<td class="num">' + f2(s.mean) + '<span class="cellbar' + (i ? ' b' : '') + '" style="width:' + Math.max(0, (s.mean - 1) / 4 * 50) + 'px"></span></td><td class="num">' + pct(s.top2) + '</td>';
        }).join('') + '</tr>';
    }).join('');
  }

  function drawOverall(S) {
    var labels = S.overall.map(function (o) { return o.item + ' (' + f2(o.mean) + ')'; });
    charts.push(new Chart(document.getElementById('c-ov'), {
      type: 'bar',
      data: { labels: labels, datasets: [0, 1, 2, 3, 4].map(function (i) {
        return { label: (i + 1) + '점 ' + (S.lblOverall[i] || ''), data: S.overall.map(function (o) { return o.n ? o.counts[i] / o.n * 100 : 0; }), _cnt: S.overall.map(function (o) { return o.counts[i]; }),
          backgroundColor: LIK[i], borderColor: '#fff', borderWidth: { left: 1, right: 1 }, borderSkipped: false, barPercentage: .78, categoryPercentage: .9 };
      }) },
      options: {
        indexAxis: 'y', maintainAspectRatio: false,
        scales: { x: { stacked: true, max: 100, ticks: { callback: function (v) { return v + '%'; } }, grid: { color: '#e1e0d9' } }, y: { stacked: true, grid: { display: false }, ticks: { color: '#0b0b0b' } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + c.dataset._cnt[c.dataIndex] + '명 (' + c.parsed.x.toFixed(1) + '%)'; } } } }
      },
      plugins: [whiteBg]
    }));
  }

  function drawMinis(S) {
    S.overall.forEach(function (o, i) {
      charts.push(new Chart(document.getElementById('c-m' + i), {
        type: 'bar',
        data: { labels: [1, 2, 3, 4, 5].map(function (v) { return [String(v), S.lblOverall[v - 1] || '']; }), datasets: [{ data: o.counts, backgroundColor: LIK, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 34 }] },
        options: {
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e1e0d9' } }, x: { grid: { display: false }, ticks: { font: { size: 10.5 } } } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { title: function (c) { return c[0].label.replace(',', '점 '); }, label: function (c) { return ' ' + c.parsed.y + '명 (' + (o.n ? (c.parsed.y / o.n * 100).toFixed(1) : 0) + '%)'; } } } }
        },
        plugins: [whiteBg]
      }));
    });
  }

  function drawCourses(S) {
    charts.push(new Chart(document.getElementById('c-cr'), {
      type: 'bar',
      data: { labels: S.courses.map(function (c) { return courseLabel(c) + (c.split ? ' ·분반' : ''); }), datasets: S.itemKeys.map(function (k, i) {
        return { label: k, data: S.courses.map(function (c) { return +c.by[k].mean.toFixed(2); }), _n: S.courses.map(function (c) { return c.by[k].n; }),
          backgroundColor: SERIES[i], borderRadius: 4, borderSkipped: 'start', borderColor: '#fff', borderWidth: { top: 1, bottom: 1 }, barPercentage: .82, categoryPercentage: .78 };
      }) },
      options: {
        indexAxis: 'y', maintainAspectRatio: false,
        layout: { padding: { right: 36 } },
        scales: { x: { min: 1, max: 5, ticks: { stepSize: 1 }, title: { display: true, text: '평균 점수 (1~5)' }, grid: { color: '#e1e0d9' } }, y: { grid: { display: false }, ticks: { color: '#0b0b0b' } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + c.parsed.x.toFixed(2) + '점 (' + c.dataset._n[c.dataIndex] + '명)'; } } } }
      },
      plugins: [whiteBg, endLabels]
    }));
  }

  function drawDemo(S) {
    S.demo.forEach(function (d, i) {
      var tot = d.entries.reduce(function (a, e) { return a + e[1]; }, 0);
      charts.push(new Chart(document.getElementById('c-d' + i), {
        type: 'bar',
        data: { labels: d.entries.map(function (e) { return e[0]; }), datasets: [{ data: d.entries.map(function (e) { return e[1]; }), backgroundColor: SERIES[0], borderRadius: 4, borderSkipped: 'start', maxBarThickness: 20 }] },
        options: {
          indexAxis: 'y', maintainAspectRatio: false,
          scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e1e0d9' } }, y: { grid: { display: false }, ticks: { color: '#0b0b0b' } } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return ' ' + c.parsed.x + '명 (' + (c.parsed.x / tot * 100).toFixed(1) + '%)'; } } } }
        },
        plugins: [whiteBg]
      }));
    });
  }

  function savePng(id, name) {
    var ch = charts.filter(function (c) { return c.canvas.id === id; })[0]; if (!ch) return;
    var a = document.createElement('a');
    a.href = ch.toBase64Image('image/png', 1);
    a.download = (cohort + '_' + name).replace(/[\\/:*?"<>|]/g, '_') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.addEventListener('beforeprint', function () { charts.forEach(function (c) { c.resize(); }); });

  /* ───── 엑셀 ───── */
  function exportXlsx(S) {
    if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    var wb = XLSX.utils.book_new();
    var r2 = function (x) { return isFinite(x) ? Math.round(x * 100) / 100 : ''; };
    var p1 = function (x) { return isFinite(x) ? Math.round(x * 1000) / 10 : ''; };

    var sum = [[(D.config.course || '') + ' ' + cohort + ' 사후설문 결과'], ['응답자 수', S.n], [],
      ['[과정 만족도]'], ['지표', '평균', '만족 비율(%)', '응답 수'].concat([1, 2, 3, 4, 5].map(function (v) { return v + '점 ' + (S.lblOverall[v - 1] || ''); }))];
    S.overall.forEach(function (o) { sum.push([o.item, r2(o.mean), p1(o.top2), o.n].concat(o.counts)); });
    sum.push([], ['[과목 평가 요약]'], ['구분', '평균', '만족 비율(%)', '응답 수']);
    S.itemKeys.forEach(function (k) {
      var s = summarize([0, 1, 2, 3, 4].map(function (i) { return S.courses.reduce(function (a, c) { return a + c.by[k].counts[i]; }, 0); }));
      sum.push([k, r2(s.mean), p1(s.top2), s.n]);
    });
    addSheet(wb, '요약', sum, [26, 10, 13, 10, 14, 14, 14, 14, 14]);

    var crs = [['일자', '시간', '과목', '강사', '분반', '응답 수'].concat([].concat.apply([], S.itemKeys.map(function (k) { return [k + ' 평균', k + ' 만족비율(%)']; })))];
    S.courses.forEach(function (c) {
      crs.push([c.date, c.time, c.title, c.inst, c.split ? '분반' : '', c.n].concat([].concat.apply([], S.itemKeys.map(function (k) { return [r2(c.by[k].mean), p1(c.by[k].top2)]; }))));
    });
    addSheet(wb, '과목별', crs, [11, 6, 24, 22, 6, 8, 12, 15, 12, 15]);

    var dm = [['항목', '값', '인원', '비율(%)']];
    S.demo.forEach(function (d) { var t = d.entries.reduce(function (a, e) { return a + e[1]; }, 0); d.entries.forEach(function (e) { dm.push([d.label, e[0], e[1], p1(e[1] / t)]); }); });
    addSheet(wb, '응답자구성', dm, [10, 22, 8, 9]);

    addSheet(wb, '응답자별', [D.resp.headers].concat(S.resp.map(function (o) { return D.resp.headers.map(function (h) { return numify(o[h]); }); })), D.resp.headers.map(function (h, i) { return i < 3 ? 18 : 14; }));
    addSheet(wb, '점수(피벗용)', [D.scores.headers].concat(S.scores.map(function (o) { return D.scores.headers.map(function (h) { return numify(o[h]); }); })), D.scores.headers.map(function () { return 13; }));

    var op = [['응답ID', '질문', '의견']];
    S.open.forEach(function (q) { S.resp.forEach(function (o) { var t = String(o[q.q] || '').trim(); if (t) op.push([o['응답ID'], q.q, t]); }); });
    addSheet(wb, '서술형', op, [18, 18, 90]);

    XLSX.writeFile(wb, ((D.config.course || '설문') + '_' + cohort + '_결과.xlsx').replace(/[\\/:*?"<>|]/g, '_'));
  }
  function numify(v) { return v !== '' && /^-?\d+(\.\d+)?$/.test(String(v)) ? +v : v; }
  function addSheet(wb, name, aoa, widths) {
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = widths.map(function (w) { return { wch: w }; });
    if (aoa.length > 1) ws['!autofilter'] = name === '요약' ? undefined : { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: aoa[0].length - 1 } }) };
    XLSX.utils.book_append_sheet(wb, ws, name);
  }

  /* ───── 설정 ───── */
  // 화면 문구 기본값 (Code.gs defaultTexts_, Index와 같은 값). 설정 칸을 비워 저장하면 이 값이 쓰인다.
  var DEFAULT_TEXTS = {
    demoTitle: '기본 정보', demoDesc: '통계 분석에만 쓰이며, 개인을 식별하지 않습니다.',
    overallTitle: '과정 만족도', overallDesc: '교육과정과 연수 운영 전반에 대해 평가해 주세요.',
    slotsTitle: '과목 평가', slotsDesc: '시간표 순서대로 과목마다 평가해 주세요. 분반 수업은 들은 수업만 고르면 됩니다.',
    splitHint: '내가 들은 수업을 고르세요',
    openTitle: '의견', openDesc: '구체적으로 적어 주시면 다음 연수에 꼭 반영하겠습니다.',
    doneMsg: '소중한 의견 감사합니다.'
  };
  function txt(c, k) { var t = c.texts && c.texts[k]; return (t != null && String(t).trim() !== '') ? String(t) : DEFAULT_TEXTS[k]; }

  function stepCard(num, title, desc, inner) {
    return '<div class="card"><div class="card-h"><div><h3>' + num + ' ' + esc(title) + '</h3>' + (desc ? '<div class="d">' + esc(desc) + '</div>' : '') + '</div></div>' + inner + '</div>';
  }

  function renderConfig() {
    var c = D.config;
    c.demographics = c.demographics || []; c.slots = c.slots || []; c.open = c.open || []; c.sessionItems = c.sessionItems || [];
    c.overall = c.overall || { scale: 'agree', items: [] };
    var rows = []; var gi = 0;
    c.slots.forEach(function (s) {
      var g = s.options.length > 1 ? String.fromCharCode(65 + gi++) : '';
      s.options.forEach(function (o) { rows.push([s.date, s.time, o.title, o.instructor, g]); });
    });
    var body = document.getElementById('body');
    body.innerHTML = '<div class="toolbar"><div class="grow"><h2>설문 설정</h2><div class="sub">응답 화면의 모든 문구와 문항을 여기서 정해요. 저장하면 바로 반영돼요. 어떤 단계의 문항을 모두 지우면 그 단계는 설문에서 빠져요.</div></div>' +
      '<a class="btn" id="preview" target="_blank" rel="noopener">응답 화면 열기</a><button class="btn primary" id="save">저장</button></div>' +

      stepCard('', '첫 화면', '설문 맨 위에 보이는 제목과 안내', '<div class="form">' +
        field('title', '설문 제목', c.title) + field('course', '과정명', c.course) + field('cohort', '기수', c.cohort) +
        field('period', '연수 기간', c.period) + area('intro', '안내 문구', c.intro, 6, '줄을 바꾸면 응답 화면에서도 그대로 줄이 바뀌어요.') + '</div>') +

      stepCard('①', '기본 정보 단계', '응답자 정보 (성별, 직렬 등). 모두 필수 응답이에요.', '<div class="form">' +
        field('t-demoTitle', '단계 이름', txt(c, 'demoTitle')) + field('t-demoDesc', '단계 설명', txt(c, 'demoDesc')) + '</div>' +
        '<div class="tbl-wrap" style="margin-top:12px"><table class="tt"><thead><tr><th style="width:120px">문항</th><th>선택지 (한 줄에 하나씩)</th><th style="width:70px">기타 입력칸</th><th>기타 입력칸 안내 문구</th><th style="width:36px"></th></tr></thead><tbody id="dt"></tbody></table></div>' +
        '<div class="hint">선택지는 한 줄에 하나씩 적어요(쉼표가 들어가도 괜찮아요). "기타 입력칸"을 체크하면 선택지 끝에 [기타]가 생기고, 고르면 글을 적는 칸이 열려요. 안내 문구는 그 칸에 흐리게 보이는 예시예요.</div>' +
        '<button class="btn sm" id="add-demo" style="margin-top:8px">문항 추가</button>') +

      stepCard('②', '과정 만족도 단계', '과정 전반을 5점 척도로 평가', '<div class="form">' +
        field('t-overallTitle', '단계 이름', txt(c, 'overallTitle')) + field('t-overallDesc', '단계 설명', txt(c, 'overallDesc')) +
        area('overall', '문항', c.overall.items.map(function (i) { return i.short + ' | ' + i.text; }).join('\n'), 9, '한 줄에 하나씩 "짧은 이름 | 문항". 짧은 이름은 차트와 엑셀에 쓰여요.') +
        field('scaleA', '척도 (1점 → 5점)', c.scales.agree.join(', '), '쉼표로 5개. 화면에는 5점이 왼쪽에 보여요.') + '</div>') +

      stepCard('③', '과목 평가 단계', '시간표의 과목마다 아래 문항을 5점 척도로 평가', '<div class="form">' +
        field('t-slotsTitle', '단계 이름', txt(c, 'slotsTitle')) + field('t-slotsDesc', '단계 설명', txt(c, 'slotsDesc')) +
        field('t-splitHint', '분반 선택 안내', txt(c, 'splitHint')) +
        area('sitems', '과목마다 묻는 문항', c.sessionItems.map(function (i) { return i.key + ' | ' + i.text; }).join('\n'), 3, '한 줄에 하나씩 "구분 | 문항" (예: 강사 | 강사는 이해하기 쉽게 전달하였다.)') +
        field('scaleB', '척도 (1점 → 5점)', c.scales.quality.join(', '), '쉼표로 5개') + '</div>' +
        '<div class="card-h" style="margin-top:14px"><div><h3 style="font-size:14.5px">시간표</h3><div class="d">분반 수업은 [분반] 칸에 같은 글자(예: A)를 넣으면 "택 1"로 묶여요. 같은 시간에 강사가 둘이고 둘 다 듣는 수업은 분반 칸을 비워 두세요.</div></div>' +
        '<div class="act"><button class="btn sm" id="paste-toggle">엑셀에서 붙여넣기</button><button class="btn sm" id="add-row">줄 추가</button></div></div>' +
        '<div id="paste-box" style="display:none;margin-bottom:10px"><textarea id="paste" style="width:100%;min-height:120px;padding:8px;border:1px solid var(--axis);border-radius:8px" placeholder="엑셀에서 [일자, 시간, 과목, 강사, 분반] 5개 열을 복사해 붙여넣으세요. (분반 열은 없어도 됨)"></textarea>' +
        '<button class="btn sm" id="paste-apply" style="margin-top:6px">표에 적용 (기존 시간표 대체)</button></div>' +
        '<div class="tbl-wrap"><table class="tt"><thead><tr><th style="width:110px">일자</th><th style="width:70px">시간</th><th>과목</th><th>강사 (소속 이름)</th><th class="grp">분반</th><th style="width:36px"></th></tr></thead><tbody id="tt"></tbody></table></div>') +

      stepCard('④', '의견 단계', '서술형 문항. 필수로 지정하지 않으면 비워도 제출돼요.', '<div class="form">' +
        field('t-openTitle', '단계 이름', txt(c, 'openTitle')) + field('t-openDesc', '단계 설명', txt(c, 'openDesc')) + '</div>' +
        '<div class="tbl-wrap" style="margin-top:12px"><table class="tt"><thead><tr><th style="width:150px">짧은 이름</th><th>질문</th><th style="width:60px">필수</th><th style="width:36px"></th></tr></thead><tbody id="ot"></tbody></table></div>' +
        '<div class="hint">짧은 이름은 결과 화면과 엑셀의 열 제목으로 쓰여요.</div>' +
        '<button class="btn sm" id="add-open" style="margin-top:8px">문항 추가</button>') +

      stepCard('', '제출 완료 화면', '', '<div class="form">' + field('t-doneMsg', '감사 메시지', txt(c, 'doneMsg')) + '</div>') +
      '<div style="height:40px"></div>';

    // 시간표 표
    var tb = document.getElementById('tt');
    function rowHTML(r) {
      return '<tr' + (r[4] ? ' class="split"' : '') + '>' + r.map(function (v, i) { return '<td' + (i === 4 ? ' class="grp"' : '') + '><input value="' + esc(v) + '" aria-label="' + ['일자', '시간', '과목', '강사', '분반'][i] + '"></td>'; }).join('') + '<td><button class="x" title="줄 삭제" aria-label="줄 삭제">×</button></td></tr>';
    }
    function drawRows(rs) { tb.innerHTML = rs.map(rowHTML).join(''); }
    drawRows(rows);
    tb.addEventListener('input', function (e) { var tr = e.target.closest('tr'); tr.classList.toggle('split', !!tr.querySelectorAll('input')[4].value.trim()); });
    document.getElementById('add-row').onclick = function () { tb.insertAdjacentHTML('beforeend', rowHTML(['', '', '', '', ''])); tb.lastElementChild.querySelector('input').focus(); };
    document.getElementById('paste-toggle').onclick = function () { var b = document.getElementById('paste-box'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
    document.getElementById('paste-apply').onclick = function () {
      var rs = document.getElementById('paste').value.split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (l) { var p = l.split('\t'); return [0, 1, 2, 3, 4].map(function (i) { return (p[i] || '').trim(); }); });
      if (!rs.length) return toast('붙여넣은 내용이 없어요.');
      drawRows(rs); document.getElementById('paste-box').style.display = 'none'; toast(rs.length + '줄을 적용했어요. [저장]을 눌러야 반영돼요.');
    };

    // 기본 정보 표
    var dt = document.getElementById('dt');
    function demoRow(d) {
      return '<tr data-id="' + esc(d.id || '') + '"><td><input value="' + esc(d.label || '') + '" aria-label="문항"></td>' +
        '<td><textarea rows="' + Math.max(2, (d.options || []).length) + '" aria-label="선택지">' + esc((d.options || []).join('\n')) + '</textarea></td>' +
        '<td style="text-align:center"><input type="checkbox"' + (d.other ? ' checked' : '') + ' aria-label="기타 입력칸" style="width:18px;height:18px"></td>' +
        '<td><input value="' + esc(d.placeholder || '') + '" placeholder="예: 직급을 적어 주세요 (예: 7급)" aria-label="기타 입력칸 안내 문구"></td>' +
        '<td><button class="x" title="문항 삭제" aria-label="문항 삭제">×</button></td></tr>';
    }
    dt.innerHTML = c.demographics.map(demoRow).join('');
    document.getElementById('add-demo').onclick = function () { dt.insertAdjacentHTML('beforeend', demoRow({})); dt.lastElementChild.querySelector('input').focus(); };

    // 서술형 표
    var ot = document.getElementById('ot');
    function openRow(q) {
      return '<tr data-id="' + esc(q.id || '') + '"><td><input value="' + esc(q.short || '') + '" aria-label="짧은 이름"></td>' +
        '<td><input value="' + esc(q.text || '') + '" aria-label="질문"></td>' +
        '<td style="text-align:center"><input type="checkbox"' + (q.required ? ' checked' : '') + ' aria-label="필수" style="width:18px;height:18px"></td>' +
        '<td><button class="x" title="문항 삭제" aria-label="문항 삭제">×</button></td></tr>';
    }
    ot.innerHTML = c.open.map(openRow).join('');
    document.getElementById('add-open').onclick = function () { ot.insertAdjacentHTML('beforeend', openRow({})); ot.lastElementChild.querySelector('input').focus(); };

    body.addEventListener('click', function (e) { if (e.target.classList.contains('x')) e.target.closest('tr').remove(); });
    document.getElementById('preview').href = surveyUrl(CUR);
    document.getElementById('save').onclick = saveCfg;
  }

  function field(id, label, val, hint) { return '<label for="f-' + id + '">' + esc(label) + '</label><div><input type="text" id="f-' + id + '" value="' + esc(val || '') + '">' + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>'; }
  function area(id, label, val, rows, hint) { return '<label for="f-' + id + '">' + esc(label) + '</label><div><textarea id="f-' + id + '" rows="' + rows + '">' + esc(val || '') + '</textarea>' + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>'; }
  function v(id) { return document.getElementById('f-' + id).value.trim(); }
  function lines(id) { return v(id).split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
  function pipe(l) { var i = l.indexOf('|'); return i < 0 ? [l.trim(), l.trim()] : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; }
  function list(s) { return s.split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
  function uniqueId(prefix, used) { var n = 1; while (used[prefix + n]) n++; used[prefix + n] = 1; return prefix + n; }

  function saveCfg() {
    var slots = [], groups = {};
    document.querySelectorAll('#tt tr').forEach(function (tr) {
      var f = Array.prototype.map.call(tr.querySelectorAll('input'), function (i) { return i.value.trim(); });
      if (!f[2]) return;
      var opt = { title: f[2], instructor: f[3] };
      if (f[4] && groups[f[4]]) { groups[f[4]].options.push(opt); return; }
      var s = { id: 's' + (slots.length + 1), date: f[0], time: f[1], options: [opt] };
      if (f[4]) groups[f[4]] = s;
      slots.push(s);
    });
    var scaleA = list(v('scaleA')), scaleB = list(v('scaleB'));
    if (scaleA.length !== 5 || scaleB.length !== 5) return toast('척도는 쉼표로 구분해 5개씩 적어 주세요.');

    // 기존 문항 ID는 유지 (응답 데이터와 연결되므로)
    var usedD = {}, demographics = [];
    document.querySelectorAll('#dt tr').forEach(function (tr) {
      var ins = tr.querySelectorAll('input, textarea'), label = ins[0].value.trim();
      if (!label) return;
      var id = tr.dataset.id && !usedD[tr.dataset.id] ? tr.dataset.id : '';
      if (id) usedD[id] = 1;
      demographics.push({ id: id, label: label, options: ins[1].value.split(/\r?\n/).map(function (o) { return o.trim(); }).filter(function (o) { return o && o !== '기타'; }), other: ins[2].checked, placeholder: ins[3].value.trim() });
    });
    demographics.forEach(function (d) { if (!d.id) d.id = uniqueId('d', usedD); });
    var bad = demographics.filter(function (d) { return !d.options.length && !d.other; })[0];
    if (bad) return toast('"' + bad.label + '"에 선택지가 없어요. 선택지를 넣거나 기타 입력칸을 체크해 주세요.');

    var usedQ = {}, open = [];
    document.querySelectorAll('#ot tr').forEach(function (tr) {
      var ins = tr.querySelectorAll('input'), short = ins[0].value.trim(), text = ins[1].value.trim();
      if (!short && !text) return;
      var id = tr.dataset.id && !usedQ[tr.dataset.id] ? tr.dataset.id : '';
      if (id) usedQ[id] = 1;
      open.push({ id: id, short: short || text.slice(0, 12), text: text || short, required: ins[2].checked });
    });
    open.forEach(function (q) { if (!q.id) q.id = uniqueId('q', usedQ); });

    var texts = {};
    Object.keys(DEFAULT_TEXTS).forEach(function (k) { texts[k] = v('t-' + k); });

    var cfg = {
      title: v('title'), course: v('course'), cohort: v('cohort'), period: v('period'), intro: v('intro'),
      texts: texts,
      scales: { agree: scaleA, quality: scaleB },
      demographics: demographics,
      overall: { scale: 'agree', items: lines('overall').map(function (l) { var p = pipe(l); return { short: p[0], text: p[1] }; }) },
      sessionItems: lines('sitems').map(function (l) { var p = pipe(l); return { key: p[0], text: p[1], scale: 'quality' }; }),
      slots: slots,
      open: open
    };
    if (!cfg.title || !cfg.cohort) return toast('설문 제목과 기수를 입력해 주세요.');
    if (cfg.slots.length && !cfg.sessionItems.length) return toast('시간표가 있으면 "과목마다 묻는 문항"이 1개 이상 필요해요.');
    var btn = document.getElementById('save'); btn.disabled = true; btn.textContent = '저장 중…';
    api('saveConfig', KEY, CUR, cfg).then(function () {
      D.config = cfg; D.meta.title = cfg.title; D.meta.course = cfg.course; D.meta.cohort = cfg.cohort;
      document.querySelector('.top h1').innerHTML = esc(cfg.title) + statusBadge(D.meta.status);
      toast('저장했어요. 응답 화면에 바로 반영돼요.');
      btn.disabled = false; btn.textContent = '저장';
      renderConfig();
    }).catch(function (e) { btn.disabled = false; btn.textContent = '저장'; toast(errMsg(e)); });
  }

  /* ───── 시작 ───── */
  KEY = ss('svy-admin') || '';
  if (KEY) api('verifyKey', KEY).then(function (ok) { if (ok) loadList(); else showLogin(); }).catch(function () { showLogin(); });
  else showLogin();
