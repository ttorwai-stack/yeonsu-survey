<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 결과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --plane: #f4f4f2;
    --surface: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --line: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-ink: #1c5cab;
    --accent-soft: #e8f1fc;
    --s1: #2a78d6;
    --s2: #eb6834;
    --l1: #c43c3c; --l2: #ee9a99; --l3: #d4d3cd; --l4: #86b6ef; --l5: #256abf;
    --danger: #d03b3b;
    --ok: #006300;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--plane); color: var(--ink); }
  body { font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .top-in { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 700; margin-right: auto; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
  .tab.on { background: var(--accent-soft); color: var(--accent-ink); }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 14px; }
  .toolbar .grow { margin-right: auto; }
  .toolbar h2 { margin: 0; font-size: 22px; }
  .toolbar .sub { color: var(--ink-2); font-size: 13.5px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { font-size: 13px; color: var(--ink-2); }
  .kpi .v { font-size: 30px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .kpi .v small { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
  .kpi .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; break-inside: avoid; }
  .card-h { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .card-h h3 { margin: 0; font-size: 16px; }
  .card-h .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .card-h .act { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .chart-box { position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sec { font-size: 18px; font-weight: 700; margin: 26px 0 10px; }
  .minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .minis .card { margin: 0; padding: 14px; }
  .minis h4 { margin: 0 0 2px; font-size: 13.5px; }
  .minis .m { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: middle; }
  th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; background: #fafaf8; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl-wrap { overflow-x: auto; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; color: #8a5200; background: #fff1d1; border-radius: 5px; padding: 0 5px; margin-left: 4px; }
  .cellbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
  .cellbar.b { background: var(--s2); }
  .muted { color: var(--ink-3); }

  .open-q { margin-bottom: 14px; }
  .open-list { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  .open-list li { padding: 9px 2px; border-bottom: 1px solid var(--grid); white-space: pre-wrap; }
  .open-list li:last-child { border-bottom: 0; }

  /* 설정 */
  .form { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: start; }
  .form label { font-weight: 600; padding-top: 8px; font-size: 13.5px; }
  .form input[type=text], .form textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--axis); border-radius: 8px; background: #fff; }
  .form textarea { min-height: 90px; font-size: 13.5px; line-height: 1.55; }
  .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .tt textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--grid); border-radius: 6px; font: inherit; font-size: 13.5px; resize: vertical; line-height: 1.45; }
  .tt input { width: 100%; padding: 6px 8px; border: 1px solid var(--grid); border-radius: 6px; }
  .tt td { padding: 4px; border: 0; }
  .tt th { background: none; }
  .tt .grp { width: 80px; }
  .tt tr.split td { background: #fff8e6; }
  /* 섹션·문항 블록 편집 */
  .sb-sec { border: 1.5px solid #c9d8ee; background: #f7faff; }
  .sb-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sb-no { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 6px; padding: 2px 8px; flex: none; }
  .sb-title { flex: 1; min-width: 200px; font-size: 16px; font-weight: 700; padding: 7px 10px; border: 1px solid var(--axis); border-radius: 8px; background: #fff; }
  .sb-desc { width: 100%; margin: 8px 0 4px; padding: 7px 10px; border: 1px solid var(--grid); border-radius: 8px; background: #fff; font-size: 13.5px; resize: vertical; }
  .sb-tools { display: flex; gap: 4px; margin-left: auto; }
  .sb-tools .btn { min-width: 32px; }
  .btn.danger { color: var(--danger); }
  .sb-blk { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .sb-blk .form { grid-template-columns: 130px 1fr; }
  .sb-blk .form input[type=text], .sb-blk .form textarea { padding: 6px 9px; }
  .sb-blk .form label { padding-top: 6px; }
  .sb-bh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sb-type { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .sb-type.t-choice { color: #1c5cab; background: #e8f1fc; }
  .sb-type.t-scale { color: #8a3f12; background: #fdebe1; }
  .sb-type.t-timetable { color: #6b4a00; background: #fff1d1; }
  .sb-type.t-text { color: #31593b; background: #e4f3e7; }
  .sb-mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sb-mode input[type=number] { width: 70px; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 8px; }
  label.sb-chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; padding-top: 6px; cursor: pointer; }
  .sb-add { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--axis); }
  .sb-add > span { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-right: 4px; }
  .sb-empty { color: var(--ink-3); font-size: 13px; padding: 14px 4px; }
  .sb-flash { animation: sbflash 1.2s; }
  @keyframes sbflash { from { box-shadow: 0 0 0 3px #86b6ef; } to { box-shadow: 0 0 0 3px transparent; } }
  .new-menu { margin-top: -4px; }
  .minis .card.wide { grid-column: 1 / -1; }
  .rank-tbl { margin-top: 8px; font-size: 12.5px; }
  .rank-tbl th, .rank-tbl td { padding: 5px 8px; }
  .qf-hint { font-weight: 400; color: #555; font-size: 11.5px; }
  .qf-num { display: inline-block; width: 22px; height: 16px; border: 1px solid #555; border-radius: 3px; margin-right: 4px; vertical-align: -3px; }
  .x { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; padding: 2px 8px; }
  .x:hover { color: var(--danger); }

  .login { max-width: 360px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .login h2 { margin: 0 0 14px; font-size: 19px; }
  .login input { width: 100%; padding: 11px 12px; border: 1px solid var(--axis); border-radius: 9px; margin-bottom: 10px; }
  .login .srv { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; justify-content: center; }
  .login .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .empty { text-align: center; color: var(--ink-2); padding: 60px 20px; }

  /* 설문 목록 */
  .st { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
  .st.open { color: #0a6b0a; background: #e3f5e3; }
  .st.closed { color: var(--ink-2); background: #ecebe7; }
  .svy-t { font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-size: 14.5px; }
  .svy-t:hover { color: var(--accent-ink); text-decoration: underline; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; }
  .back { border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; padding: 6px 8px 6px 0; }
  .back:hover { color: var(--accent-ink); }
  .top h1 .st { margin-left: 8px; vertical-align: 2px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; display: none; }

  @media (max-width: 820px) {
    .grid2 { grid-template-columns: 1fr; }
    .form { grid-template-columns: 1fr; }
    .form label { padding-top: 0; }
    .sb-blk .form { grid-template-columns: 1fr; }
  }
  /* 과목별 그래프 보기 선택 */
  .crv-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg-b { border: 0; background: var(--surface); padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); }
  .seg-b:last-child { border-right: 0; }
  .seg-b.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

  /* 보고서 미리보기 (A4 폭) */
  #report-wrap { position: fixed; inset: 0; z-index: 50; background: #e7e6e1; overflow: auto; }
  .rp-bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .rp-tip { color: var(--ink-2); margin-right: auto; }
  #report { width: 794px; max-width: calc(100% - 32px); margin: 20px auto 40px; padding: 52px 52px 60px; background: #fff; color: #111; font-size: 12.5px; line-height: 1.55; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  #report .rp-head { border-bottom: 3px solid #111; padding-bottom: 14px; margin-bottom: 8px; }
  #report .rp-kicker { font-size: 12px; color: #555; font-weight: 600; }
  #report h1 { font-size: 22px; margin: 4px 0 6px; line-height: 1.3; }
  #report .rp-meta { color: #444; }
  #report h2 { font-size: 16px; margin: 26px 0 10px; padding-bottom: 5px; border-bottom: 1.5px solid #333; break-after: avoid; page-break-after: avoid; }
  #report h3 { font-size: 13.5px; margin: 16px 0 6px; break-after: avoid; page-break-after: avoid; }
  #report h4 { font-size: 12.5px; margin: 0 0 4px; }
  .rp-fig { margin: 6px 0 12px; break-inside: avoid; page-break-inside: avoid; }
  .rp-fig img { display: block; width: 100%; height: auto; }
  .rp-cap { font-size: 11px; color: #666; margin-top: 3px; }
  .rp-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 4px 0 10px; }
  .rp-tbl th, .rp-tbl td { border: 1px solid #d5d3cc; padding: 4px 6px; text-align: left; vertical-align: top; }
  .rp-tbl th { background: #f2f1ed; font-weight: 700; }
  .rp-tbl .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rp-tbl tr { break-inside: avoid; page-break-inside: avoid; }
  .rp-keep { break-inside: avoid; page-break-inside: avoid; }
  .rp-demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
  .rp-demo-i { break-inside: avoid; page-break-inside: avoid; }
  .rp-cnt { font-weight: 400; color: #666; font-size: 11.5px; }
  .rp-open { margin: 4px 0 10px; padding-left: 20px; }
  .rp-open li { margin: 0 0 5px; white-space: pre-wrap; break-inside: avoid; page-break-inside: avoid; }
  /* 설문지 (종이 양식) */
  .rp-chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
  .rp-newpage { break-before: page; page-break-before: always; margin-top: 40px; padding-top: 24px; border-top: 2px dashed #bbb; }
  .rp-appx-label { font-size: 12px; font-weight: 700; color: #666; letter-spacing: .1em; }
  .qf-intro { white-space: pre-line; margin: 10px 0; }
  .qf-desc { color: #555; margin: 0 0 8px; font-size: 12px; }
  .qf-q { margin: 0 0 12px; break-inside: avoid; page-break-inside: avoid; }
  .qf-qt { font-weight: 700; margin-bottom: 4px; }
  .qf-opts { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .qf-blank { display: inline-block; width: 120px; border-bottom: 1px solid #333; margin: 0 4px; vertical-align: -2px; }
  .qf-tbl .qf-c { text-align: center; width: 54px; font-size: 10.5px; }
  .qf-tbl td.qf-c { font-size: 15px; color: #444; }
  .qf-tbl .qf-split td { background: #fbf8ef; }
  .qf-tag { display: inline-block; font-size: 10px; font-weight: 700; color: #7a4a00; border: 1px solid #d9b86b; border-radius: 4px; padding: 0 4px; }
  .qf-inst { color: #555; }
  .qf-lines div { height: 26px; border-bottom: 1px solid #999; }
  .qf-end { margin-top: 24px; text-align: center; color: #555; }

  @media print {
    @page { size: A4; margin: 12mm; }
    body.reporting > :not(#report-wrap) { display: none !important; }
    body.reporting #report-wrap { position: static; overflow: visible; background: #fff; }
    body.reporting .rp-bar { display: none !important; }
    body.reporting #report { width: auto; max-width: none; margin: 0; padding: 0; box-shadow: none; }
    body.reporting .rp-newpage { margin-top: 0; padding-top: 0; border-top: 0; }
    body { background: #fff; font-size: 12px; }
    header.top, .toolbar .btn, .toolbar select, .card-h .act, .no-print { display: none !important; }
    .card, .kpi { border-color: #ddd; }
    .open-list { max-height: none; overflow: visible; }
    th { position: static; }
    .wrap { max-width: none; padding: 0; }
  }
</style>
</head>
<body>
<div id="root"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ───── 서버 호출 ───── */
  // 실행 환경: Apps Script 안(gas) / 내 PC 미리보기(mock) / GitHub Pages 등 외부(http)
  // 데이터 서버 = 각 관리자의 Apps Script 웹앱. 링크의 ?api=배포ID 가 있으면 그 관리자 서버로, 없으면 기본 서버로.
  // 보안: 구글 Apps Script 배포 ID 형식만 받는다(다른 사이트로는 응답이 가지 않음).
  var DEFAULT_API_ID = 'AKfycbyUUAH8jsoHkZlngyhJ6pab1aRJy3X7qi1H0665IOJNG7RxVgA21-v33suYtOqjMyGo3Q';
  function apiIdFrom(v) { var m = String(v || '').trim().match(/(?:^|\/s\/)(AKfyc[\w-]{20,})(?:\/(?:exec|dev))?\/?$/); return m ? m[1] : ''; }  // 관리자 페이지는 마지막으로 연결한 서버를 이 기기에 기억한다 (?api= 로 처음 한 번 들어오면 됨)
  var API_ID = (function () {
    var p = apiIdFrom(new URLSearchParams(location.search).get('api')), s = '';
    try { s = apiIdFrom(localStorage.getItem('svy-api')); if (p) localStorage.setItem('svy-api', p); } catch (e) { /* 저장 안 돼도 동작 */ }
    return p || s || DEFAULT_API_ID;
  })();
  var API_URL = 'https://script.google.com/macros/s/' + API_ID + '/exec';
  function apiParam() { return API_ID === DEFAULT_API_ID ? '' : 'api=' + API_ID; }
  var MODE = (window.google && google.script && google.script.run) ? 'gas'
    : /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'mock' : 'http';
  var ready = new Promise(function (resolve) {
    if (MODE !== 'mock') return resolve();
    var s = document.createElement('script');
    s.src = 'dev/mock.js';
    s.onload = function () { window.MockReady.then(resolve); };
    document.head.appendChild(s);
  });
  function pageBase() { return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, ''); }
  // 서버 혼잡(BUSY)이나 구글 쪽 일시 오류는 자동으로 다시 시도한다.
  // 제출은 화면이 만든 응답ID로 보내므로 다시 보내도 서버에서 하나만 저장된다.
  function httpOnce(name, args, attempt) {
    attempt = attempt || 0;
    var waits = [1500, 3000, 5000, 8000];
    var retry = function (why) {
      if (attempt >= waits.length) throw why;
      return new Promise(function (r) { setTimeout(r, waits[attempt] + Math.random() * 1000); })
        .then(function () { return httpOnce(name, args, attempt + 1); });
    };
    // 30초 넘게 답이 없으면 끊고 다시 시도 (제출도 응답ID가 같아 서버에서 하나만 저장됨)
    var ctl = window.AbortController ? new AbortController() : null;
    var limit = /^(getResults|listSurveys|createSurvey|saveConfig)$/.test(name) ? 90000 : 30000; // 무거운 관리자 요청은 넉넉히
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, limit) : null;
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: name, args: args }), signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        return r.text().then(function (t) {
          var j;
          try { j = JSON.parse(t); } catch (e) { return retry(new Error('서버가 바빠요. 잠시 후 다시 눌러 주세요.')); } // 구글이 실행 전에 거절(HTML 오류)
          if (j.ok) return j.data;
          if (/^BUSY/.test(j.error)) return retry(new Error(j.error.replace(/^BUSY:\s*/, '')));
          var fe = new Error(j.error); fe.final = true; throw fe;
        });
      }, function (netErr) {
        clearTimeout(timer);
        return retry(new Error('인터넷 연결을 확인해 주세요.'));
      });
  }

    });
    document.querySelector('#crs-tbl tbody').innerHTML = rows.map(function (c) {
      return '<tr><td>' + esc(c.date) + '</td><td>' + esc(c.time) + '</td><td>' + esc(c.title) + (c.split ? '<span class="badge">분반</span>' : '') + '</td><td>' + esc(c.inst) + '</td><td class="num">' + c.n + '</td>' +
        S.itemKeys.map(function (k, i) {
          var s = c.by[k];
          return '<td class="num">' + f2(s.mean) + '<span class="cellbar' + (i ? ' b' : '') + '" style="width:' + Math.max(0, (s.mean - 1) / 4 * 50) + 'px"></span></td><td class="num">' + pct(s.top2) + '</td>';
        }).join('') + '</tr>';
    }).join('');
  }

  /** 보기 방식(view)에 맞춘 과목 목록·지표 (대시보드와 보고서 공용) */
  function courseView(S, view) {
    var keys = view.metric === 'both' ? S.itemKeys.slice() : [S.itemKeys[+view.metric]];
    var score = function (c) { return keys.reduce(function (a, k) { return a + c.by[k].mean; }, 0) / keys.length; };
    var rows = S.courses.slice();
    if (view.sort === 'pos') rows.sort(function (a, b) { return a.pos - b.pos; });
    else rows.sort(function (a, b) { return (view.sort === 'desc' ? score(b) - score(a) : score(a) - score(b)) || a.pos - b.pos; });
    // 순위는 높은 점수 = 1위 (동점은 같은 순위)
    var desc = S.courses.map(score).sort(function (a, b) { return b - a; });
    var rank = function (c) { var s = score(c); return desc.findIndex(function (x) { return Math.abs(x - s) < 1e-9; }) + 1; };
    return { keys: keys, rows: rows, rank: rank, score: score, perRow: keys.length > 1 ? 42 : 30 };
  }

  function courseChartConfig(S, view, fixed) {
    var v = courseView(S, view);
    var labels = v.rows.map(function (c) { return (view.sort !== 'pos' ? v.rank(c) + '위  ' : '') + courseLabel(c) + (c.split ? ' ·분반' : ''); });
    return {
      type: 'bar',
      data: { labels: labels, datasets: v.keys.map(function (k) {
        var ci = S.itemKeys.indexOf(k);
        return { label: k, data: v.rows.map(function (c) { return +c.by[k].mean.toFixed(2); }), _n: v.rows.map(function (c) { return c.by[k].n; }),
          backgroundColor: SERIES[ci], borderRadius: 4, borderSkipped: 'start', borderColor: '#fff', borderWidth: { top: 1, bottom: 1 },
          barPercentage: v.keys.length > 1 ? .82 : .7, categoryPercentage: v.keys.length > 1 ? .78 : .9 };
      }) },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, responsive: !fixed, animation: fixed ? false : undefined, devicePixelRatio: fixed ? 2 : undefined,
        layout: { padding: { right: 8 } },
        scales: { x: { min: 1, max: 5, ticks: { stepSize: 1 }, title: { display: true, text: '평균 점수 (1~5)' }, grid: { color: '#e1e0d9' } }, y: { grid: { display: false }, ticks: { color: '#0b0b0b' } } },
        plugins: { legend: { display: false }, tooltip: { enabled: !fixed, callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + c.parsed.x.toFixed(2) + '점 (' + c.dataset._n[c.dataIndex] + '명)'; } } } }
      },
      plugins: [whiteBg, endLabels],
      _height: 60 + v.rows.length * v.perRow
    };
  }

  function drawCourses(S) {
    var old = charts.filter(function (c) { return c.canvas.id === 'c-cr'; })[0];
    if (old) { old.destroy(); charts = charts.filter(function (c) { return c !== old; }); }
    var cfg = courseChartConfig(S, CRV, false);
    var box = document.getElementById('c-cr').parentNode; box.style.height = cfg._height + 'px';
    charts.push(new Chart(document.getElementById('c-cr'), cfg));
    var lg = document.getElementById('cr-legend');
    if (lg) lg.innerHTML = legendHTML(courseView(S, CRV).keys.map(function (k) { return [k, SERIES[S.itemKeys.indexOf(k)]]; })).replace(/^<div class="legend">|<\/div>$/g, '');
    document.querySelectorAll('[data-crv]').forEach(function (b) { var p = b.dataset.crv.split(':'); b.classList.toggle('on', String(CRV[p[0]]) === p[1]); });
  }

  function savePng(id, name) {
    var ch = charts.filter(function (c) { return c.canvas.id === id; })[0]; if (!ch) return;
    var a = document.createElement('a');
    a.href = ch.toBase64Image('image/png', 1);
    a.download = [cohort, name].filter(Boolean).join('_').replace(/[\\/:*?"<>|]/g, '_') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.addEventListener('beforeprint', function () { charts.forEach(function (c) { c.resize(); }); });

  /* ───── 보고서 (PDF) ─────
   * 화면을 그대로 찍지 않고, A4 폭(본문 690px)에 맞춰 차트를 새로 그려 이미지로 고정한다 → 잘리거나 넘치지 않음.
   * 미리보기 → [PDF로 저장 / 인쇄] → 인쇄 창에서 "PDF로 저장" */
  var RP_W = 690;

  function chartImg(cfg, w, h) {
    var holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + w + 'px;height:' + h + 'px';
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h; holder.appendChild(cv); document.body.appendChild(holder);
    cfg.options = cfg.options || {};
    cfg.options.responsive = false; cfg.options.maintainAspectRatio = false; cfg.options.animation = false; cfg.options.devicePixelRatio = 2;
    var ch = new Chart(cv, cfg), url = ch.toBase64Image('image/png', 1);
    ch.destroy(); holder.remove();
    return url;
  }

  function rpFig(url, caption) { return '<div class="rp-fig"><img src="' + url + '" alt="' + esc(caption || '') + '">' + (caption ? '<div class="rp-cap">' + esc(caption) + '</div>' : '') + '</div>'; }
  function rpTable(head, rows, numCols) {
    numCols = numCols || [];
    // 16줄 이하의 짧은 표는 쪽이 바뀌는 곳에서 갈라지지 않게 통째로 다음 쪽으로 넘긴다
    return (rows.length <= 16 ? '<div class="rp-keep">' : '<div>') + '<table class="rp-tbl"><thead><tr>' + head.map(function (h, i) { return '<th' + (numCols.indexOf(i) >= 0 ? ' class="num"' : '') + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (v, i) { return '<td' + (numCols.indexOf(i) >= 0 ? ' class="num"' : '') + '>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }


  function openReport(S) {
    var c = D.config, today = new Date(), agg = courseAgg(S);
    var ymd = today.getFullYear() + '. ' + (today.getMonth() + 1) + '. ' + today.getDate() + '.';
    var h = '<header class="rp-head"><div class="rp-kicker">' + esc([c.course, cohort].filter(Boolean).join(' ')) + ' 설문 결과 보고</div>' +
      '<h1>' + esc(c.title) + '</h1><div class="rp-meta">' + [c.period ? '연수 기간 ' + esc(c.period) : '', '응답자 ' + S.n + '명', '작성일 ' + ymd].filter(Boolean).join(' · ') + '</div></header>';

    // 요약: 척도 묶음 평균 + 과목 평가 평균
    var sum = [], sr = S.scaleRes.filter(function (R) { return R.items.length; });
    sr.forEach(function (R, i) {
      if (i === 0) sum.push([R.items[0].item, f2(R.items[0].mean), pct(R.items[0].top2)]);
      sum.push([R.name + ' 평균 (' + R.items.length + '개 지표)', f2(R.all.mean), pct(R.all.top2)]);
    });
    agg.forEach(function (a) { sum.push(['과목 ' + a.k + ' 평균 (' + S.courses.length + '개 과목)', f2(a.s.mean), pct(a.s.top2)]); });
    if (sum.length) h += '<section><h2>요약</h2>' + rpTable(['구분', '평균 (5점 만점)', '4~5점 비율'], sum, [1, 2]) + '</section>';

    // 섹션 순서대로
    c.sections.forEach(function (sec) {
      var parts = '', small = [];
      var flush = function () { if (small.length) { parts += '<div class="rp-demo">' + small.join('') + '</div>'; small = []; } };
      sec.blocks.forEach(function (b) {
        var R = S.res[b.id];
        if (b.type === 'choice') {
          if (!R.base) return;
          if (R.mode === 'rank') {
            flush();
            parts += '<h3>' + esc(b.label) + ' <span class="rp-cnt">' + esc(choiceSub(R)) + '</span></h3>' +
              rpFig(chartImg(choiceChartCfg(R, true), RP_W, 40 + R.entries.length * 26)) +
              rpTable(['순위', '항목'].concat(R.rows[0].r.map(function (_, i) { return (i + 1) + '순위'; })).concat(['점수']),
                R.rows.map(function (x, i) { return [i + 1, x.opt].concat(x.r).concat([x.score]); }), R.rows[0].r.map(function (_, i) { return i + 2; }).concat([R.K + 2]));
          } else {
            small.push('<div class="rp-demo-i"><h4>' + esc(b.label) + (R.mode === 'multi' ? ' <span class="rp-cnt">(복수 선택)</span>' : '') + '</h4>' +
              rpTable(['구분', '명', R.mode === 'multi' ? '응답자 대비' : '비율'], R.entries.map(function (e) { return [e[0], e[1], rateOf(R, e[1])]; }), [1, 2]) + '</div>');
          }
          return;
        }
        flush();
        if (b.type === 'scale') {
          if (!R.items.length) return;
          parts += (b.title ? '<h3>' + esc(b.title) + '</h3>' : '') +
            rpFig(chartImg(scaleChartCfg(R, true), RP_W, 70 + R.items.length * 34), '지표별 응답 분포 (막대 길이 = 응답 비율, 괄호 = 평균)') +
            rpTable(['지표', '평균', R.pos, '응답'].concat([5, 4, 3, 2, 1].map(function (v) { return v + '점'; })),
              R.items.map(function (o) { return [o.item, f2(o.mean), pct(o.top2), o.n].concat([4, 3, 2, 1, 0].map(function (i) { return o.counts[i]; })); }),
              [1, 2, 3, 4, 5, 6, 7, 8]);
        } else if (b.type === 'timetable') {
          if (!S.courses.length) return;
          S.itemKeys.forEach(function (k, i) {
            var cc = courseChartConfig(S, { metric: String(i), sort: 'desc' }, true);
            parts += '<h3>' + esc(k) + ' 점수 순위</h3>' + rpFig(chartImg(cc, RP_W, cc._height), k + ' 평균 점수가 높은 순 (1~5점)');
          });
          parts += '<h3>과목별 상세 (시간표순)</h3>' + rpTable(['일자', '시간', '과목', '강사', '응답'].concat([].concat.apply([], S.itemKeys.map(function (k) { return [k + ' 평균', k + ' 만족 비율']; }))),
            S.courses.slice().sort(function (a, z) { return a.pos - z.pos; }).map(function (x) {
              return [x.date, x.time, x.title + (x.split ? ' (분반)' : ''), x.inst, x.n].concat([].concat.apply([], S.itemKeys.map(function (k) { return [f2(x.by[k].mean), pct(x.by[k].top2)]; })));
            }), [4, 5, 6, 7, 8]) + '<div class="rp-cap">평균 = 5점 만점 평균 · 만족 비율 = 5점 척도에서 위쪽 두 칸(5점·4점)을 고른 사람의 비율</div>';
        } else if (b.type === 'text') {
          parts += '<h3>' + esc(R.q) + ' <span class="rp-cnt">' + R.answers.length + '건' + (R.skipped ? ' · "없음" 등 ' + R.skipped + '건 제외' : '') + '</span></h3>' +
            (R.answers.length ? '<ol class="rp-open">' + R.answers.map(function (a) { return '<li>' + esc(a.text) + '</li>'; }).join('') + '</ol>' : '<p class="rp-cnt">응답 없음</p>');
        }
      });
      flush();
      if (parts) h += '<section><h2>' + esc(sec.title) + '</h2>' + parts + '</section>';
    });

    showPreview('보고서 미리보기', h, (c.title || '설문 결과') + ' 결과 보고서', true);
  }

  /* ───── 설문지 (종이 양식) ─────
   * 현재 설정 그대로: 섹션 순서, 객관식(☐ / 순위는 숫자 칸), 척도표(응답 화면처럼 5점이 왼쪽), 시간표(분반은 택 1), 서술형 적는 칸 */
  function questionnaireHTML(c) {
    var circles = function (n) { var s = ''; for (var i = 0; i < n; i++) s += '<td class="qf-c">○</td>'; return s; };
    var rev = function (l) { return (l || []).slice().reverse(); }; // 5점 → 1점
    var q = 0;
    var h = '<header class="rp-head"><div class="rp-kicker">설문지</div><h1>' + esc(c.title) + '</h1>' +
      (c.period ? '<div class="rp-meta">연수 기간 ' + esc(c.period) + '</div>' : '') + '</header>';
    if (c.intro) h += '<p class="qf-intro">' + esc(c.intro) + '</p>';
    h += '<p class="qf-desc">* 표시는 필수 응답입니다. 척도 문항은 해당하는 칸 하나에 ✔ 표시해 주세요.</p>';

    c.sections.forEach(function (sec, si) {
      h += '<section><h2>' + (si + 1) + '. ' + esc(sec.title) + '</h2>' + (sec.desc ? '<p class="qf-desc">' + esc(sec.desc) + '</p>' : '');
      sec.blocks.forEach(function (b) {
        if (b.type === 'choice') {
          var K = pickK(b), all = b.options.length + (b.other ? 1 : 0);
          var hint = b.mode === 'multi' ? (K >= all ? '해당하는 것 모두 ✔' : '최대 ' + K + '개 ✔') : b.mode === 'rank' ? '중요한 순서대로 칸에 1~' + K + ' 숫자를 적어 주세요' : '';
          var box = b.mode === 'rank' ? '<span class="qf-num"></span>' : '☐ ';
          h += '<div class="qf-q"><div class="qf-qt">' + (++q) + '. ' + esc(b.label) + ' *' + (hint ? ' <span class="qf-hint">(' + esc(hint) + ')</span>' : '') + '</div><div class="qf-opts">' +
            b.options.map(function (o) { return '<span>' + box + esc(o) + '</span>'; }).join('') +
            (b.other ? '<span>' + box + '기타 (<span class="qf-blank"></span>)</span>' : '') + '</div></div>';
        } else if (b.type === 'scale') {
          var la = rev(b.labels);
          h += (b.title ? '<h3>' + esc(b.title) + '</h3>' : '') +
            '<table class="rp-tbl qf-tbl"><thead><tr><th>문항</th>' + la.map(function (l) { return '<th class="qf-c">' + esc(l) + '</th>'; }).join('') + '</tr></thead><tbody>' +
            b.items.map(function (it) { return '<tr><td>' + (++q) + '. ' + esc(it.text) + ' *</td>' + circles(la.length) + '</tr>'; }).join('') + '</tbody></table>';
        } else if (b.type === 'timetable') {
          var lb = rev(b.labels);
          if (b.slots.some(function (s) { return s.options.length > 1; })) h += '<p class="qf-desc">「분반 · 택 1」 수업은 ' + esc(b.splitHint || '내가 들은 수업을 고르세요') + '. 들은 수업 한 줄에만 응답해 주세요.</p>';
          b.items.forEach(function (it) {
            h += '<h3>' + (++q) + '. [' + esc(it.key) + '] ' + esc(it.text) + ' *</h3>' +
              '<table class="rp-tbl qf-tbl"><thead><tr><th style="width:70px">일자</th><th style="width:38px">시간</th><th>과목 · 강사</th>' + lb.map(function (l) { return '<th class="qf-c">' + esc(l) + '</th>'; }).join('') + '</tr></thead><tbody>';
            b.slots.forEach(function (s) {
              var split = s.options.length > 1;
              s.options.forEach(function (o, i) {
                h += '<tr' + (split ? ' class="qf-split"' : '') + '><td>' + (i === 0 ? esc(s.date) : '') + '</td><td>' + (i === 0 ? esc(s.time) : '') + '</td><td>' +
                  (split ? '<span class="qf-tag">분반 · 택 1</span> ' : '') + esc(o.title) + (o.instructor ? ' <span class="qf-inst">(' + esc(o.instructor) + ')</span>' : '') + '</td>' + circles(lb.length) + '</tr>';
              });
            });
            h += '</tbody></table>';
          });
        } else if (b.type === 'text') {
          h += '<div class="qf-q"><div class="qf-qt">' + (++q) + '. ' + esc(b.text) + (b.required ? ' *' : ' (선택)') + '</div><div class="qf-lines"><div></div><div></div><div></div></div></div>';
        }
      });
      h += '</section>';
    });
    return h + '<p class="qf-end">' + esc(c.doneMsg || '소중한 의견 감사합니다.') + '</p>';
  }

  function openQuestionnaire() {
    var c = D.config;
    showPreview('설문지 미리보기', questionnaireHTML(JSON.parse(JSON.stringify(c))), (c.title || '설문') + ' 설문지', false);
  }

  /** 미리보기 화면 (보고서·설문지 공용). withAppendix = 보고서에 「부록: 설문지」 붙이기 선택칸 */
  function showPreview(label, bodyHtml, docTitle, withAppendix) {
    var wrap = document.createElement('div');
    wrap.id = 'report-wrap';
    wrap.innerHTML = '<div class="rp-bar"><b>' + esc(label) + '</b><span class="rp-tip">[PDF로 저장 / 인쇄] → 인쇄 창의 <b>대상</b>에서 "PDF로 저장"을 고르세요.</span>' +
      (withAppendix ? '<label class="rp-chk"><input type="checkbox" id="rp-appx" checked> 설문지 포함 (부록)</label>' : '') +
      '<button class="btn primary" id="rp-print">PDF로 저장 / 인쇄</button><button class="btn" id="rp-close">닫기</button></div>' +
      '<div id="report">' + bodyHtml +
      (withAppendix ? '<div id="rp-appendix" class="rp-newpage"><div class="rp-appx-label">부록</div>' + questionnaireHTML(JSON.parse(JSON.stringify(D.config))) + '</div>' : '') + '</div>';
    document.body.appendChild(wrap);
    document.body.classList.add('reporting');
    var prevTitle = document.title;
    document.title = docTitle; // PDF 저장 시 기본 파일 이름
    var chk = document.getElementById('rp-appx');
    if (chk) chk.onchange = function () { document.getElementById('rp-appendix').style.display = chk.checked ? '' : 'none'; document.title = docTitle + (chk.checked ? ' (설문지 포함)' : ''); };
    if (chk) document.title = docTitle + ' (설문지 포함)';
    document.getElementById('rp-print').onclick = function () { window.print(); };
    document.getElementById('rp-close').onclick = function () { wrap.remove(); document.body.classList.remove('reporting'); document.title = prevTitle; };
  }


  /* ───── 엑셀 ───── */
  function exportXlsx(S) {
    if (!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    var wb = XLSX.utils.book_new(), c = D.config;
    var r2 = function (x) { return isFinite(x) ? Math.round(x * 100) / 100 : ''; };
    var p1 = function (x) { return isFinite(x) ? Math.round(x * 1000) / 10 : ''; };

    var sum = [[[c.course, cohort].filter(Boolean).join(' ') + ' 설문 결과'], ['응답자 수', S.n]];
    S.scaleRes.forEach(function (R) {
      if (!R.items.length) return;
      sum.push([], ['[' + R.name + ']'], ['지표', '평균', R.pos + '(%)', '응답 수'].concat([1, 2, 3, 4, 5].map(function (v) { return v + '점 ' + (R.labels[v - 1] || ''); })));
      R.items.forEach(function (o) { sum.push([o.item, r2(o.mean), p1(o.top2), o.n].concat(o.counts)); });
    });
    if (S.itemKeys.length) {
      sum.push([], ['[과목 평가 요약]'], ['구분', '평균', '만족 비율(%)', '응답 수']);
      courseAgg(S).forEach(function (a) { sum.push([a.k, r2(a.s.mean), p1(a.s.top2), a.s.n]); });
    }
    addSheet(wb, '요약', sum, [26, 10, 13, 10, 14, 14, 14, 14, 14]);

    if (S.courses.length) {
      var crs = [['일자', '시간', '과목', '강사', '분반', '응답 수'].concat([].concat.apply([], S.itemKeys.map(function (k) { return [k + ' 평균', k + ' 만족비율(%)']; })))];
      S.courses.forEach(function (x) {
        crs.push([x.date, x.time, x.title, x.inst, x.split ? '분반' : '', x.n].concat([].concat.apply([], S.itemKeys.map(function (k) { return [r2(x.by[k].mean), p1(x.by[k].top2)]; }))));
      });
      addSheet(wb, '과목별', crs, [11, 6, 24, 22, 6, 8, 12, 15, 12, 15]);
    }

    var ch = [], rk = [], maxK = 0;
    Object.keys(S.res).forEach(function (id) { var R = S.res[id]; if (R.b.type !== 'choice' || !R.base) return; if (R.mode === 'rank') { rk.push(R); maxK = Math.max(maxK, R.K); } else ch.push(R); });
    if (ch.length) {
      var dm = [['문항', '값', '인원', '비율(%)', '비율 기준']];

  function onConfigClick(e) {

  // 화면의 칸 → W
  function collect() {

    });
    document.querySelectorAll('.sb-blk').forEach(function (el) {
      var b = W.sections[+el.dataset.si].blocks[+el.dataset.bi]; if (!b) return;
      var f = function (n) { return el.querySelector('[data-f="' + n + '"]'); }, val = function (n) { return f(n).value.trim(); };
      if (b.type === 'choice') {
        b.label = val('label'); b.mode = f('mode').value;
        var mx = parseInt(f('max').value, 10);
        if (b.mode !== 'single' && mx >= 1) b.max = mx; else delete b.max;
        b.options = splitLines(f('options').value).filter(function (o) { return o !== '기타'; });
        b.other = f('other').checked; b.placeholder = val('placeholder');
      } else if (b.type === 'scale') {
        b.title = val('title'); b.labels = list(f('labels').value); b.posName = val('posName') || '만족 비율';
        b.items = splitLines(f('items').value).map(function (l) { var p = pipe(l); return { short: p[0], text: p[1] }; });
      } else if (b.type === 'timetable') {
        b.items = splitLines(f('items').value).map(function (l) { var p = pipe(l); return { key: p[0], text: p[1] }; });
        b.labels = list(f('labels').value); b.splitHint = val('splitHint');
        var slots = [], groups = {};
        el.querySelectorAll('#tt tr').forEach(function (tr) {
          var x = Array.prototype.map.call(tr.querySelectorAll('input'), function (i) { return i.value.trim(); });
          if (!x[2]) return;
          var opt = { title: x[2], instructor: x[3] };
          if (x[4] && groups[x[4]]) { groups[x[4]].options.push(opt); return; }
          var s = { id: 's' + (slots.length + 1), date: x[0], time: x[1], options: [opt] };
          if (x[4]) groups[x[4]] = s;
          slots.push(s);
        });
        b.slots = slots;
      } else if (b.type === 'text') {
        b.short = val('short'); b.text = val('text'); b.required = f('required').checked;
        if (!b.short && b.text) b.short = b.text.slice(0, 12);
        if (!b.text && b.short) b.text = b.short;
      }
    });
  }

  function saveCfg() {
    collect();
    var cfg = JSON.parse(JSON.stringify(W));
    // 척도 묶음의 시트 열 머리·영역 이름: 응답이 쌓인 뒤에는 바꾸지 않는다(이어지도록). 응답이 없을 때는 지금 이름을 따른다.
    var fresh = D.partial ? !(D.meta && +D.meta.count) : !(D.resp && D.resp.rows.length);
    cfg.sections.forEach(function (s) { s.blocks.forEach(function (b) {
      if (b.type !== 'scale') return;
      if (fresh || !b.prefix) b.prefix = b.title || s.title;
      if (fresh || !b.area) b.area = b.prefix;
    }); });
    var bad = '';
    cfg.sections.some(function (s) { return s.blocks.some(function (b) { if ((b.type === 'scale' || b.type === 'timetable') && b.labels.length !== 5) { bad = '척도 이름은 쉼표로 구분해 5개를 적어 주세요.'; return true; } }); });
    if (!cfg.title) bad = '설문 제목을 입력해 주세요.';
    if (bad) return toast(bad);
    var btn = document.getElementById('save'); btn.disabled = true; btn.textContent = '저장 중…';
    api('saveConfig', KEY, CUR, cfg).then(function () {
      D.config = cfg; W = JSON.parse(JSON.stringify(cfg));
      if (D.partial) delete RES[CUR]; // 미리 받아 둔 결과는 예전 설정 기준이라 버린다
      D.meta.title = cfg.title; D.meta.course = cfg.course; D.meta.cohort = cfg.cohort;
      document.querySelector('.top h1').innerHTML = esc(cfg.title) + statusBadge(D.meta.status);
      toast('저장했어요. 응답 화면에 바로 반영돼요.');
      btn.disabled = false; btn.textContent = '저장';
      drawConfig();
    }).catch(function (e) { btn.disabled = false; btn.textContent = '저장'; toast(errMsg(e)); });
  }

  /* ───── 시작 ───── */
  KEY = ss('svy-admin') || '';
  // 한동안 안 쓰면 구글 서버가 잠들어 첫 요청이 20초 넘게 걸린다 → 비밀번호 치는 동안 미리 깨워 둔다
  if (MODE === 'http') api('listOpenSurveys').catch(function () { /* 깨우기용 */ });
  if (KEY) loadList();
  else showLogin();
})();
</script>
</body>
